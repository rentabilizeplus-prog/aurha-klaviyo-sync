name: Rede de seguranca Quiz -> Mautic (segmento 536 / funil v2)

on:
  schedule:
    - cron: '0 * * * *'   # 1x por hora
  workflow_dispatch: {}

jobs:
  quiz-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconciliar planilha do quiz com o segmento 536 (so leads pos-corte)
        env:
          MAUTIC_BASE: ${{ secrets.MAUTIC_BASE }}
          MAUTIC_USER: ${{ secrets.MAUTIC_USER }}
          MAUTIC_PASS: ${{ secrets.MAUTIC_PASS }}
        run: python quiz_sync.py
