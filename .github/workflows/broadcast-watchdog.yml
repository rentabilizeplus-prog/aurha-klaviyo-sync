name: Vigia de entrega de broadcast (Mautic)

# Os disparos saem 12:00 UTC (09:00 BRT) e 21:00 UTC (18:00 BRT).
# As faixas 06-11 sao a checagem PREVENTIVA: e' quando ainda da pra encolher a
# base se o publico nao couber na cota que sobra do SES. Depois das 12:00 o
# aviso ja e' autopsia.
on:
  schedule:
    - cron: '*/20 6-11 * * *'    # antes do disparo da manha: da tempo de agir
    - cron: '*/10 12-16 * * *'   # durante o disparo da manha
    - cron: '*/15 21-23 * * *'   # disparos da noite
    - cron: '25 * * * *'         # ronda de hora em hora: motor parado a qualquer hora
  workflow_dispatch:
    inputs:
      lookahead_hours:
        description: 'Com quantas horas de antecedencia olhar o proximo disparo'
        default: '6'
      ses_quota:
        description: 'Teto do SES por 24h corridas'
        default: '73000'

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir cota, motor e proximos disparos
        env:
          MAUTIC_BASE: ${{ secrets.MAUTIC_BASE }}
          MAUTIC_USER: ${{ secrets.MAUTIC_USER }}
          MAUTIC_PASS: ${{ secrets.MAUTIC_PASS }}
          WATCH_PREFIX: 'lc'
          SES_DAILY_QUOTA: ${{ github.event.inputs.ses_quota || '73000' }}
          LOOKAHEAD_HOURS: ${{ github.event.inputs.lookahead_hours || '6' }}
          WINDOW_HOURS: '8'
          STALL_MINUTES: '45'
          STALL_REMAINING: '500'
          ENGINE_IDLE_MINUTES: '90'
        run: python broadcast_watchdog.py
