name: Programa de Embaixadoras -> cashback (Shopify/Yampi/Mautic)

on:
  schedule:
    - cron: '0 */2 * * *'   # a cada 2 horas
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nao credita nada)'
        type: choice
        options: ['true','false']
        default: 'true'

# GATE DE LANCAMENTO: enquanto GO_LIVE!='true', o schedule roda em DRY_RUN (nao credita/envia).
# Para ligar de verdade: trocar GO_LIVE para 'true' abaixo (ou rodar manualmente com dry_run=false).
env:
  GO_LIVE: 'false'

jobs:
  referral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Processar indicacoes
        env:
          MAUTIC_BASE: ${{ secrets.MAUTIC_BASE }}
          MAUTIC_USER: ${{ secrets.MAUTIC_USER }}
          MAUTIC_PASS: ${{ secrets.MAUTIC_PASS }}
          YAMPI_ALIAS: ${{ secrets.YAMPI_ALIAS }}
          YAMPI_TOKEN: ${{ secrets.YAMPI_TOKEN }}
          YAMPI_SECRET: ${{ secrets.YAMPI_SECRET }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          REWARD_PCT: '15'
          CASHBACK_DAYS: ''          # vazio = cashback SEM validade
          REWARD_EMAIL_ID: '158'
          # No schedule so credita se GO_LIVE=='true'; caso contrario roda DRY. Manual usa o input.
          DRY_RUN: ${{ github.event_name == 'schedule' && (env.GO_LIVE == 'true' && 'false' || 'true') || github.event.inputs.dry_run }}
        run: python referral_processor.py
      - name: Commit state (dedupe)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "Aurha CRM"
          git config user.email "rentabilizeplus@gmail.com"
          git add referral_state.json || true
          git commit -m "referral: atualiza state [skip ci]" || echo "sem mudancas"
          git push || echo "push falhou"
