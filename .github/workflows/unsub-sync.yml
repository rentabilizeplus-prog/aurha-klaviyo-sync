name: Descadastro Shopify -> Mautic (DNC)

on:
  schedule:
    - cron: '17 * * * *'   # de hora em hora
  workflow_dispatch: {}

jobs:
  unsub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descadastrados na Shopify viram DNC no Mautic
        env:
          SHOP_DOMAIN: artesanatoholistico.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MAUTIC_BASE: ${{ secrets.MAUTIC_BASE }}
          MAUTIC_USER: ${{ secrets.MAUTIC_USER }}
          MAUTIC_PASS: ${{ secrets.MAUTIC_PASS }}
          LOOKBACK_HOURS: '26'
        run: python unsub_sync.py
